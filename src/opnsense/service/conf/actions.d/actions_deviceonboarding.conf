[start]
command:/usr/local/etc/rc.d/deviceonboarding start
parameters:
type:script
message:starting Device Onboarding

[stop]
command:/usr/local/etc/rc.d/deviceonboarding stop
parameters:
type:script
message:stopping Device Onboarding

[restart]
command:/usr/local/etc/rc.d/deviceonboarding restart
parameters:
type:script
message:restarting Device Onboarding

[reload]
command:/usr/bin/true
parameters:
type:script
message:reloading Device Onboarding (the watcher picks up configuration changes by itself)

[status]
command:/usr/local/etc/rc.d/deviceonboarding status; exit 0
parameters:
type:script_output
message:requesting Device Onboarding status

[list]
command:/usr/local/opnsense/scripts/deviceonboarding/ctl.py list
parameters:
type:script_output
message:listing Device Onboarding windows

[open]
command:/usr/local/opnsense/scripts/deviceonboarding/ctl.py open
parameters:%s %s
type:script_output
message:opening Device Onboarding window for %s

[close]
command:/usr/local/opnsense/scripts/deviceonboarding/ctl.py close
parameters:%s
type:script_output
message:closing Device Onboarding window for %s

[forget]
command:/usr/local/opnsense/scripts/deviceonboarding/ctl.py forget
parameters:%s
type:script_output
message:forgetting Device Onboarding device %s
